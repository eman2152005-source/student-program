<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>
<body>

    <h1>Student Management System</h1>
    <p>Open Console to see the results.</p>

    <script>

        class Student {

            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;
            }

            calculateAverage() {
                let total = this.grades.reduce((sum, grade) => sum + grade, 0);
                return total / this.grades.length;
            }

            getGrade(average) {
                if (average >= 90) {
                    return "A";
                } else if (average >= 80) {
                    return "B";
                } else if (average >= 70) {
                    return "C";
                } else if (average >= 60) {
                    return "D";
                } else if (average >= 50) {
                    return "E";
                } else {
                    return "F";
                }
            }

            getResult(average) {
                if (average >= 50 && this.attendance >= 75) {
                    return "ناجح";
                } else {
                    return "يحتاج مراجعة";
                }
            }
        }

        let studentsList = [
            new Student(101, "Ahmed", [45, 48, 42], 80),
            new Student(102, "Mariam", [60, 55, 65], 90),
            new Student(103, "Omar", [40, 45, 50], 85),
            new Student(104, "Sara", [90, 85, 95], 95)
        ];

        console.log("STUDENTS REPORTS");

        studentsList.forEach(student => {
            let average = student.calculateAverage();

            console.log("ID:", student.id);
            console.log("Name:", student.name);
            console.log("Average:", average);
            console.log("Grade:", student.getGrade(average));
            console.log("Result:", student.getResult(average));
            console.log("----------------------");
        });

        let strugglingStudents = studentsList.filter(student => {
            let average = student.calculateAverage();
            return average >= 40 && average <= 49;
        });

        console.log("STRUGGLING STUDENTS");
        console.table(strugglingStudents);

        let studentsAfterBonus = strugglingStudents.map(student => {
            let oldAverage = student.calculateAverage();

            return {
                id: student.id,
                name: student.name,
                oldAverage: oldAverage,
                newAverage: oldAverage + 5
            };
        });

        let totalNewAverages = studentsAfterBonus.reduce((sum, student) => {
            return sum + student.newAverage;
        }, 0);

        let bonusAverage = studentsAfterBonus.length > 0
            ? totalNewAverages / studentsAfterBonus.length
            : 0;

        console.log("BONUS COMMITTEE REPORT");
        console.table(studentsAfterBonus);
        console.log("Total Students:", studentsAfterBonus.length);
        console.log("Total New Averages:", totalNewAverages);
        console.log("Average After Bonus:", bonusAverage);

    </script>

</body>
</html>
